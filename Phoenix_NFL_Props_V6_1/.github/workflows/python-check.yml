name: Python source checks

on:
  push:
  pull_request:

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile nfl_props_v6_1.py
      - name: Run source-integrity tests
        run: python -m unittest discover -s tests -v
