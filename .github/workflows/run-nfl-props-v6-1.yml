name: Phoenix NFL Props V6.1 Production Run

on:
  workflow_dispatch:
    inputs:
      season:
        description: Target NFL season
        required: true
        default: "2026"
        type: string
      week:
        description: Optional NFL week override; blank = next unplayed week
        required: false
        default: ""
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  run-model:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'RUN MODEL')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: Phoenix_NFL_Props_V6_1
    env:
      PHOENIX_TARGET_SEASON: ${{ github.event_name == 'workflow_dispatch' && inputs.season || '2026' }}
      PHOENIX_TARGET_WEEK: ${{ github.event_name == 'workflow_dispatch' && inputs.week || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Phoenix_NFL_Props_V6_1/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve current NFL week
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          import pandas as pd
          import nflreadpy as nfl
          from pathlib import Path

          season = int(os.environ.get("PHOENIX_TARGET_SEASON", "2026"))
          override = os.environ.get("PHOENIX_TARGET_WEEK", "").strip()
          if override:
              week = int(override)
              source = "workflow override"
          else:
              s = nfl.load_schedules([season]).to_pandas()
              s["season"] = pd.to_numeric(s["season"], errors="coerce")
              s["week"] = pd.to_numeric(s["week"], errors="coerce")
              future = s[
                  s["season"].eq(season)
                  & s["home_score"].isna()
                  & s["away_score"].isna()
              ].copy()
              if "game_type" in future.columns:
                  future = future[future["game_type"].astype(str).str.upper().eq("REG")]
              cols = [c for c in ["gameday","gametime"] if c in future.columns]
              if cols:
                  future = future.sort_values(cols)
              if future.empty:
                  raise RuntimeError(f"No unplayed regular-season NFL games found for {season}")
              week = int(future.iloc[0]["week"])
              source = "next unplayed schedule"

          p = Path("nfl_props_v6_1.py")
          text = p.read_text(encoding="utf-8")
          text, n1 = re.subn(r"^TARGET_SEASON\s*=\s*\d+\s*$", f"TARGET_SEASON = {season}", text, count=1, flags=re.M)
          text, n2 = re.subn(r"^TARGET_WEEK\s*=\s*\d+\s*$", f"TARGET_WEEK = {week}", text, count=1, flags=re.M)
          if n1 != 1 or n2 != 1:
              raise RuntimeError(f"Could not patch target config safely: season={n1}, week={n2}")
          p.write_text(text, encoding="utf-8")
          print(f"Resolved Phoenix NFL Props target: {season} Week {week} ({source})")
          PY

      - name: Restore NFL props warehouse and cache
        uses: actions/cache@v4
        with:
          path: |
            Phoenix_NFL_Props_V6_1/phoenix_data/NFL_Props_Warehouse
            Phoenix_NFL_Props_V6_1/phoenix_cache
          key: ${{ runner.os }}-phoenix-nfl-props-v6-1-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-phoenix-nfl-props-v6-1-

      - name: Run Phoenix NFL Props V6.1
        run: python nfl_props_v6_1.py

      - name: Export full matched board
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python export_adversarial_top10.py

      - name: Publish current full NFL props board
        run: |
          mkdir -p ../phoenix_current_run
          cp "$(ls -t phoenix_generative_props_v6_1/PHOENIX_NFL_PROPS_FULL_MATCHED_BOARD_*.csv | head -1)" ../phoenix_current_run/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv
          python - <<'PY'
          import json, re
          from pathlib import Path
          import pandas as pd
          p=Path('../phoenix_current_run/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv')
          df=pd.read_csv(p)
          src=sorted(Path('phoenix_generative_props_v6_1').glob('PHOENIX_NFL_GENERATIVE_PROPS_V6_1_*.csv'))[-1].name
          m=re.search(r'_(\d{4})_W(\d+)\.csv$',src)
          meta={
              'engine':'PHOENIX_NFL_PROPS',
              'version':'6.1.2',
              'season':int(m.group(1)) if m else 2026,
              'week':int(m.group(2)) if m else None,
              'source_sha':'${{ github.sha }}',
              'run_id':'${{ github.run_id }}',
              'model_first':True,
              'ev_used':False,
              'sportsbook_role':'downstream proposition matching and -200 hard ceiling only',
              'candidate_count':int(len(df))
          }
          Path('../phoenix_current_run/NFL_PROPS_RUN_METADATA_CURRENT.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          print(p, len(df))
          PY
          cd ..
          git config user.name "Phoenix Actions"
          git config user.email "actions@users.noreply.github.com"
          cp phoenix_current_run/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv /tmp/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv
          cp phoenix_current_run/NFL_PROPS_RUN_METADATA_CURRENT.json /tmp/NFL_PROPS_RUN_METADATA_CURRENT.json
          published=false
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p phoenix_current_run
            cp /tmp/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv phoenix_current_run/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv
            cp /tmp/NFL_PROPS_RUN_METADATA_CURRENT.json phoenix_current_run/NFL_PROPS_RUN_METADATA_CURRENT.json
            git add phoenix_current_run/NFL_PROPS_FULL_QUALIFYING_BOARD_CURRENT.csv phoenix_current_run/NFL_PROPS_RUN_METADATA_CURRENT.json
            if git diff --cached --quiet; then published=true; break; fi
            git commit -m "Publish Phoenix NFL props current full board [skip ci]"
            if git push origin HEAD:main; then published=true; break; fi
            sleep $((attempt * 2))
          done
          $published || { echo "Failed to publish current NFL props board after retries"; exit 1; }

      - name: Upload Phoenix NFL Props outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-nfl-props-v6-1-${{ github.run_id }}
          path: |
            Phoenix_NFL_Props_V6_1/phoenix_generative_props_v6_1/
            Phoenix_NFL_Props_V6_1/PHOENIX_NFL_GENERATIVE_PROPS_V6_1_*.zip
          if-no-files-found: warn
          retention-days: 14
